server.port=8080
# URL
application.front-end.url=http://localhost:3000
application.backend.url=http://localhost:8080
application.cors.allowed.origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,https://www.flomadtravel.com,https://flomadtravel.com,https://api.flomadtravel.com,https://ai-travel-planner-frontend-nextjs.vercel.app,https://ai-travel-planner-frontend-nextjs-git-feature-authentication-system.vercel.app
# MongoDB (use 27018 for mongotravel container; 27017 for default mongodb)
spring.data.mongodb.uri=mongodb://localhost:27018/testdb
spring.data.mongodb.auto-index-creation=true
# Note: Local MongoDB typically doesn't require authentication
# spring.data.mongodb.username=
# spring.data.mongodb.password=
# Local environment properties

# Elasticsearch configuration
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=your_password

# Logging to show endpoint mappings
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

# AI Model Performance Tuning - GPT-4o with optimized settings
spring.ai.openai.chat.options.max-completion-tokens=8192
spring.ai.openai.chat.options.model=gpt-4o
# Temperature for balanced creative and factual responses
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.presence-penalty=

# HTTP Client Timeouts - ULTRA AGGRESSIVE for <2s target + STREAMING
spring.cloud.openfeign.client.config.default.connect-timeout=500
spring.cloud.openfeign.client.config.default.read-timeout=2000
# Enable optimizations for faster response start
# GPT-4o: 2x faster response times + multimodal capabilities + better reasoning

# Connection Pool Optimization
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=50
server.tomcat.connection-timeout=3000ms
server.tomcat.keep-alive-timeout=3000ms

# Redis Cache Configuration - DISABLED for local development to prevent connection errors
spring.cache.type=simple
# Disable Redis for local development - prevents connection refused errors
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
# Redis health check disabled
management.health.redis.enabled=false

# Rate Limiting Configuration - ULTRA HIGH LIMITS FOR DEVELOPMENT
# Maximum limits for development/testing to prevent any blocking
app.rate-limit.chat-requests-per-minute=10000
app.rate-limit.chat-requests-per-hour=100000
app.rate-limit.guest-requests-per-minute=10000
app.rate-limit.guest-requests-per-hour=100000
app.rate-limit.auth-requests-per-minute=10000
app.rate-limit.auth-requests-per-hour=100000
app.rate-limit.general-requests-per-minute=10000
app.rate-limit.general-requests-per-hour=100000
app.rate-limit.expensive-requests-per-minute=10000
app.rate-limit.expensive-requests-per-hour=100000

# Async Processing Configuration
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=async-

# ===============================
# LOCAL DEVELOPMENT CONFIGURATION FIXES
# ===============================

# Disable Mail Service for Local Development - prevents SSL handshake errors
management.health.mail.enabled=false
application.email.confirmation.enabled=false
# Override mail configuration to disable it
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Disable Elasticsearch for Local Development (if not running)
management.health.elasticsearch.enabled=false

# Enhanced Security Configuration for Local Development
logging.level.com.springboot.FlomadAIplanner.filter.JwtRequestFilter=DEBUG
logging.level.com.springboot.FlomadAIplanner.util.CurrentUserUtil=DEBUG
logging.level.org.springframework.security=DEBUG

# WebSocket Configuration for Local Development
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging=DEBUG

# Ensure proper session management
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# Disable problematic health checks for local development
management.health.defaults.enabled=false
management.health.diskspace.enabled=true
management.health.ping.enabled=true
management.health.mongo.enabled=true
