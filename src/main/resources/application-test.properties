# Test Configuration
spring.profiles.active=test

# JWT Test Configuration
jwt.secret=test-secret-key-for-testing-purposes
jwt.expiration=86400000

# MongoDB Test Configuration (embedded)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=travel_planner_test

# Spring AI Test Configuration
spring.ai.openai.api-key=test-key
spring.ai.openai.chat.options.model=gpt-5-mini
spring.ai.openai.chat.options.max-completion-tokens=8192

# Redis Test Configuration (embedded)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.cache-names=locations,places,weather
spring.cache.redis.time-to-live=300000

# Rate Limiting Test Configuration
app.rate-limit.chat.requests-per-minute=100
app.rate-limit.auth.requests-per-minute=100  
app.rate-limit.guest.requests-per-minute=50
app.rate-limit.general.requests-per-minute=200

# Logging Configuration for Tests
logging.level.com.springboot.FlomadAIplanner=DEBUG
logging.level.org.springframework.ai=DEBUG