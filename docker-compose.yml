version: '3.8'

services:
  springboot:
    build: .
    container_name: springboot
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - logstash
    networks:
      - springboot-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.1
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"
    networks:
      - springboot-network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.10.1
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200/
    networks:
      - springboot-network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.10.1
    ports:
      - "5044:5044"
    volumes:
      - ./src/main/resources/logging/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200/
    networks:
      - springboot-network

networks:
  springboot-network:

