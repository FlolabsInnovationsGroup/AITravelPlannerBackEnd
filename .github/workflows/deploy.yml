name: Deploy to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # S3 bucket used to hand the JAR to the server.
      # Set in GitHub: Settings > Secrets and variables > Actions > Variables > DEPLOY_BUCKET
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      # EC2 instance that runs the app (must show as 'Online' in AWS Systems Manager > Fleet Manager).
      # Set in GitHub: Settings > Secrets and variables > Actions > Variables > EC2_INSTANCE_ID
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - name: Require DEPLOY_BUCKET
        run: |
          if [ -z "$DEPLOY_BUCKET" ]; then
            echo "::error::Repository variable DEPLOY_BUCKET is not set"
            exit 1
          fi
          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "::error::Repository variable EC2_INSTANCE_ID is not set"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Upload JAR to S3
        run: |
          aws s3 cp target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar \
            s3://${DEPLOY_BUCKET}/Flomad-AI-planner-0.0.1-SNAPSHOT.jar

      - name: Deploy via AWS SSM
        run: |
          # Generate presigned URL for S3 download
          PRESIGNED_URL=$(aws s3 presign s3://${DEPLOY_BUCKET}/Flomad-AI-planner-0.0.1-SNAPSHOT.jar --expires-in 300)
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot application" \
            --parameters "commands=[
              \"#!/bin/bash\",
              \"set -e\",
              \"# Download JAR from S3 using presigned URL\",
              \"curl -f -o /tmp/Flomad-AI-planner-0.0.1-SNAPSHOT.jar '$PRESIGNED_URL'\",
              \"# Move to ubuntu app directory\",
              \"sudo mv /tmp/Flomad-AI-planner-0.0.1-SNAPSHOT.jar /home/ubuntu/app/Flomad-AI-planner-0.0.1-SNAPSHOT.jar\",
              \"sudo chown ubuntu:ubuntu /home/ubuntu/app/Flomad-AI-planner-0.0.1-SNAPSHOT.jar\",
              \"# Update .env file\",
              \"sudo tee /home/ubuntu/app/.env > /dev/null << 'ENVEOF'\",
              \"SPRING_AI_OPENAI_API_KEY=${{ secrets.SPRING_AI_OPENAI_API_KEY }}\",
              \"GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}\",
              \"VIATOR_API_KEY=${{ secrets.VIATOR_API_KEY }}\",
              \"VIATOR_PARTNER_KEY=${{ secrets.VIATOR_PARTNER_KEY }}\",
              \"AMADEUS_API_KEY=${{ secrets.AMADEUS_API_KEY }}\",
              \"AMADEUS_API_SECRET=${{ secrets.AMADEUS_API_SECRET }}\",
              \"JWT_SECRET=${{ secrets.JWT_SECRET }}\",
              \"SPRING_DATA_MONGODB_URI=mongodb://localhost:27017/travel_planner\",
              \"WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}\",
              \"POSITIONSTACK_API_KEY=${{ secrets.POSITION_STACK_API_KEY }}\",
              \"FREECURRENCY_API_KEY=${{ secrets.FREECURRENCY_API_KEY }}\",
              \"MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}'\",
              \"LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}\",
              \"LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}\",
              \"SERVER_PORT=8080\",
              \"SPRING_PROFILES_ACTIVE=prod\",
              \"ENVEOF\",
              \"sudo chown ubuntu:ubuntu /home/ubuntu/app/.env\",
              \"# Stop existing process\",
              \"sudo pkill -f Flomad-AI-planner || true\",
              \"sleep 5\",
              \"# Start new process as ubuntu user\",
              \"cd /home/ubuntu/app\",
              \"sudo -u ubuntu nohup java -Xmx2048m -Xms512m -XX:+UseG1GC -jar Flomad-AI-planner-0.0.1-SNAPSHOT.jar > stdout.log 2>&1 &\",
              \"# Wait up to 4 minutes for the app to report healthy; on failure show the app log\",
              \"if ! timeout 240 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'; then echo 'App did not become healthy.'; echo '--- java process running?'; (pgrep -f Flomad-AI-planner.jar > /dev/null && echo YES) || echo NO; echo '--- health response'; (curl -s -m 5 http://localhost:8080/actuator/health || echo 'no response'); echo; echo '--- memory'; free -m; echo '--- killed by out-of-memory?'; (dmesg | grep -i -E 'out of memory|killed process' | tail -3 || true); echo '--- last log lines'; (tail -n 80 /home/ubuntu/app/stdout.log || true); exit 1; fi\"
            ]" \
            --output text \
            --query "Command.CommandId")
          
          echo "Command ID: $COMMAND_ID"
          
          # Poll until the command finishes (the built-in waiter gives up after 100s and hides the output)
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "Command status: $STATUS"
          echo "----- Output from the server -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query StandardOutputContent --output text
          echo "----- Errors from the server -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query StandardErrorContent --output text

          [ "$STATUS" = "Success" ] || exit 1
