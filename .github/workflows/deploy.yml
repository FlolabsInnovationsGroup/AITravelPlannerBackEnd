name: Deploy to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress -DskipTests

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
          
          # Test SSH connection
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST 'echo "SSH connection successful"'

      - name: Deploy to EC2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          # Copy JAR file
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa target/*.jar $SSH_USER@$SSH_HOST:~/docker-app/Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          
          # Execute deployment commands
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST '
            cd ~/docker-app
          
            # Backup current state
            docker-compose -f docker-compose.yml down || true
          
            # Start services with new JAR
            docker-compose -f docker-compose.yml up -d --build
          
            # Wait for application to start
            sleep 30
          
            # Check application health
            curl -f http://localhost:8080/actuator/health || echo "Health check failed"
          '

      - name: Verify Deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST '
            echo "Container Status:"
            docker ps
          
            echo "Application Logs:"
            docker logs flomad-app --tail 20
          '