# Logging Configuration for Production
logging.level.com.springboot.FlomadAIplanner=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO

# Production Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# WebSocket Configuration for Production
spring.websocket.allowed-origins=https://www.flomadtravel.com,https://flomadtravel.com,https://api.flomadtravel.com

# CORS Configuration for Production
application.cors.allowed.origins=https://www.flomadtravel.com,https://flomadtravel.com,https://api.flomadtravel.com
spring.web.cors.allowed-origins=https://www.flomadtravel.com,https://flomadtravel.com,https://api.flomadtravel.com

# Actuator Configuration for Production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mongo.enabled=true

# Production Performance Tuning
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Disable development features in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false