name: FloTravel - Latency Testing

on:
  push:
    branches: [ "master" ]

jobs:
  perf-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot app
        run: mvn -B package

      - name: Start Spring Boot backend
        run: |
          nohup mvn spring-boot:run &
          sleep 12   # give time for boot

      - name: Run latency benchmark (Apache Benchmark)
        run: |
          ab -n 200 -c 10 http://localhost:8080/actuator/health > ab-results.txt

      - name: Upload latency results
        uses: actions/upload-artifact@v4
        with:
          name: latency-metrics
          path: ab-results.txt
