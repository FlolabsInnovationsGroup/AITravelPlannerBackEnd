name: Deploy to AWS EC2

on:
  push:
    branches:
      - master  # Make sure this matches your main branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ec2-54-208-146-208.compute-1.amazonaws.com >> ~/.ssh/known_hosts

      - name: Copy JAR to EC2
        run: scp -i ~/.ssh/id_rsa target/*.jar ubuntu@ec2-54-208-146-208.compute-1.amazonaws.com:/home/ubuntu/app/

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@ec2-54-208-146-208.compute-1.amazonaws.com '
          cd ~/app
          sudo systemctl stop flomad
          mv *.jar Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          sudo systemctl start flomad
          '