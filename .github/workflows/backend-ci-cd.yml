name: FloTravel - BackEnd CI/CD Latency Testing

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run Integration Tests
        run: mvn -B verify -P integration-tests

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: target/failsafe-reports

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Start Spring Boot Server
        run: |
          nohup mvn spring-boot:run &
          sleep 20

      - name: Run E2E Tests
        run: mvn -B test -P e2e

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: target/surefire-reports


  # ======================================
  # 4. LATENCY + LOAD TEST (k6)
  # ======================================
  latency-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Start Spring Boot Server
        run: |
          nohup mvn spring-boot:run &
          sleep 20

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create k6 Latency Test Script
        run: |
          cat << 'EOF' > latency-test.js
          import http from 'k6/http';
          import { sleep } from 'k6';

          export const options = {
            vus: 20,            // 20 virtual users
            duration: '30s',    // run for 30 seconds
            thresholds: {
              http_req_duration: ['p(95)<500'],   // 95% of requests < 500ms
            },
          };

          export default function () {
            http.get('https://www.flomadtravel.com/auth/signin'); // CHANGE THIS TO YOUR ENDPOINT
            sleep(0.1);
          }
          EOF

      - name: Run k6 Latency Test
        run: |
          mkdir -p k6-results
          k6 run latency-test.js --out json=k6-results/latency.json | tee k6-results/summary.txt

      - name: Upload Latency Test Results
        uses: actions/upload-artifact@v4
        with:
          name: latency-test-results
          path: k6-results


  release:
    runs-on: ubuntu-latest
    needs: [ integration-tests, e2e-tests, latency-test ]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: built-jar
          path: ./release-output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            release-output/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

