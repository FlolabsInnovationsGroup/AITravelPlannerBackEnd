# Spring Boot Test Configuration
server.port=0
application.front-end.url=http://localhost:${server.port}
application.backend.url=http://localhost:${server.port}
application.cors.allowed.origins=http://localhost:${server.port}

# MongoDB Test Configuration
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uri=mongodb://localhost:27017/test-db

# Disable Mongock migrations during testing if not needed
mongock.enabled=true

# PositionStack API Configuration for testing
positionstack.api.baseurl=api.positionstack.com
positionstack.api.key=test-key

# Spring AI Configuration for testing
spring.ai.openai.api-key=test-key
spring.ai.openai.model=gpt-3.5-turbo
spring.ai.openai.max-tokens=4096

# Vertex AI Configuration for testing
spring.ai.vertex.ai.project-id=test-project
spring.ai.vertex.ai.location=test-location
spring.ai.vertex.ai.api-key=test-key

