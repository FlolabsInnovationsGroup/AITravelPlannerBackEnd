name: Deploy to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 50.17.181.203
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            cat > ~/app/.env << 'ENVEOF'
            SPRING_AI_OPENAI_API_KEY=${{ secrets.SPRING_AI_OPENAI_API_KEY }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            VIATOR_API_KEY=${{ secrets.VIATOR_API_KEY }}
            VIATOR_PARTNER_KEY=${{ secrets.VIATOR_PARTNER_KEY }}
            AMADEUS_API_KEY=${{ secrets.AMADEUS_API_KEY }}
            AMADEUS_API_SECRET=${{ secrets.AMADEUS_API_SECRET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MONGO_URL=${{ secrets.MONGO_URL }}
            WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
            POSITION_STACK_API_KEY=${{ secrets.POSITION_STACK_API_KEY }}
            SPRING_PROFILES_ACTIVE=prod
            ENVEOF
            if [ ! -d ~/AITravelPlannerBackEnd ]; then
              cd ~ && git clone https://github.com/FlomadLabsRD/AITravelPlannerBackEnd.git
            else
              cd ~/AITravelPlannerBackEnd && git pull origin master
            fi
            cd ~/AITravelPlannerBackEnd && mvn clean package -DskipTests
            cp target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar ~/app/
            cd ~/docker-app
            docker-compose down || true
            rm -f *.jar .env
            cp ~/app/Flomad-AI-planner-0.0.1-SNAPSHOT.jar .
            cp ~/app/.env .
            docker-compose up -d
            sleep 30
            curl -f http://localhost:8080/actuator/health
