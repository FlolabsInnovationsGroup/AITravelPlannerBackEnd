server.port=8080
# URL
application.front-end.url=http://localhost:3001
application.backend.url=http://localhost:8080
application.cors.allowed.origins=http://localhost:3001,http://localhost:8080
# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=testdb
spring.data.mongodb.username=# By default, no authentication is needed
spring.data.mongodb.password=# By default, no authentication is needed
spring.data.mongodb.auto-index-creation=true
# Local environment properties

# Elasticsearch configuration
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=your_password

# Liquibase
spring.liquibase.change-log=classpath:liquibase/main-lquibase.xml
spring.liquibase.enabled=true

# And some test configuraation for H2 Database as an example.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.platform=h2  # this is used by Spring Boot to generate database-specific queries
# SQL is written to be idempotent so this is safe
spring.sql.init.mode=always