name: Deploy to AWS EC2

on:
  push:
    branches:
      - master  # Make sure this matches your main branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress -DskipTests

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ec2-50-17-181-203.compute-1.amazonaws.com >> ~/.ssh/known_hosts

      - name: Create .env file
        run: |
          cat > .env << EOF
          SPRING_AI_OPENAI_API_KEY=${{ secrets.SPRING_AI_OPENAI_API_KEY }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          VIATOR_API_KEY=${{ secrets.VIATOR_API_KEY }}
          VIATOR_PARTNER_KEY=${{ secrets.VIATOR_PARTNER_KEY }}
          AMADEUS_API_KEY=${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET=${{ secrets.AMADEUS_API_SECRET }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MONGO_URL=${{ secrets.MONGO_URL }}
          WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          POSITION_STACK_API_KEY=${{ secrets.POSITION_STACK_API_KEY }}
          SPRING_PROFILES_ACTIVE=prod
          EOF
          echo ".env file created successfully"

      - name: Verify JAR before copy
        run: |
          echo "=== JAR FILE ON GITHUB ACTIONS ==="
          ls -lh target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          echo ""
          echo "=== JAR CHECKSUM ==="
          sha256sum target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          echo ""
          echo "=== JAR STRUCTURE CHECK ==="
          unzip -l target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar | grep -E "BOOT-INF|springframework" | head -10
      
      - name: Copy files to EC2
        run: |
          scp -v -i ~/.ssh/id_rsa target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar ubuntu@ec2-50-17-181-203.compute-1.amazonaws.com:/home/ubuntu/app/
          scp -v -i ~/.ssh/id_rsa .env ubuntu@ec2-50-17-181-203.compute-1.amazonaws.com:/home/ubuntu/app/

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@ec2-50-17-181-203.compute-1.amazonaws.com '
          echo "=== INVESTIGATING EC2 SETUP ==="
          
          echo ""
          echo "=== Checking Docker Setup ==="
          docker --version 2>&1 || echo "Docker not installed"
          docker-compose --version 2>&1 || echo "Docker Compose not installed"
          ls -la ~/docker-app 2>&1 || echo "No docker-app directory"
          
          echo ""
          echo "=== Checking Systemd Setup ==="
          sudo systemctl status flomad --no-pager 2>&1 || echo "No flomad systemd service"
          ls -la /etc/systemd/system/flomad.service 2>&1 || echo "No systemd service file"
          
          echo ""
          echo "=== Checking Running Processes ==="
          ps aux | grep -E "java|docker" | grep -v grep || echo "No Java/Docker processes"
          
          echo ""
          echo "=== Checking Nginx Setup ==="
          sudo systemctl status nginx --no-pager 2>&1 || echo "Nginx not running"
          
          echo ""
          echo "=== Checking Directories ==="
          ls -la ~/app 2>&1 || echo "No ~/app directory"
          ls -la ~/ | grep -E "app|docker"
          
          echo ""
          echo "=== System Resources ==="
          df -h | grep -E "Filesystem|/dev"
          free -h
          
          echo ""
          echo "=== DEPLOYMENT DECISION ==="
          if [ -d ~/docker-app ] && [ -f ~/docker-app/docker-compose.yml ]; then
            echo "Using Docker Compose deployment"
            cd ~/docker-app
            
            # Stop existing container
            docker-compose down 2>&1 || echo "No containers to stop"
            
            # Clean old files
            rm -f *.jar 2>&1 || echo "No old JARs to remove"
            
            # Copy new JAR
            echo "Copying JAR from ~/app to ~/docker-app"
            cp ~/app/Flomad-AI-planner-0.0.1-SNAPSHOT.jar . 2>&1 || echo "Failed to copy JAR"
            
            # Copy .env file
            cp ~/app/.env . 2>&1 || echo "Failed to copy .env"
            
            # Start containers
            docker-compose up -d
            
            echo ""
            echo "=== Waiting for container startup (30 seconds) ==="
            sleep 30
            
            echo ""
            echo "=== Container Status ==="
            docker-compose ps
            
            echo ""
            echo "=== Container Logs ==="
            docker-compose logs --tail=50
            
          elif sudo systemctl list-unit-files | grep -q flomad.service; then
            echo "Using systemd deployment"
            cd ~/app
            
            # Stop service
            sudo systemctl stop flomad
            sleep 3
            
            # Start service
            sudo systemctl daemon-reload
            sudo systemctl start flomad
            
            echo ""
            echo "=== Waiting for service startup (30 seconds) ==="
            sleep 30
            
            echo ""
            echo "=== Service Status ==="
            sudo systemctl status flomad --no-pager
            
          else
            echo "ERROR: No deployment method found!"
            echo "Neither docker-compose.yml nor systemd service exists"
            exit 1
          fi
          
          echo ""
          echo "=== Removing old JAR files from target directory ==="
          # Only clean up old JARs in subdirectories, not the root level
          rm -rf target/ || echo "No target directory to clean"
          find . -name "*.jar.original" -delete || echo "No .original files to clean"

          
          echo ""
          echo "=== TESTING HEALTH ENDPOINT ==="
          for i in {1..5}; do
            echo "Attempt $i of 5..."
            if curl -f http://localhost:8080/actuator/health; then
              echo "✅ SUCCESS! Backend is healthy"
              exit 0
            fi
            echo "Health check failed, waiting 10 seconds..."
            sleep 10
          done
          
          echo ""
          echo "❌ FAILED! Backend not responding"
          echo ""
          echo "=== RECENT ERROR LOGS ==="
          tail -100 logs/error.log 2>/dev/null || echo "No error log available"
          
          echo ""
          echo "=== JOURNAL LOGS (Last 100 lines) ==="
          sudo journalctl -u flomad -n 100 --no-pager
          
          echo ""
          echo "=== FILE PERMISSIONS ==="
          ls -la Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          
          exit 1
          '