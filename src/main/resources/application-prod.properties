# Production Configuration
server.port=8080

# MongoDB Configuration for Production
spring.data.mongodb.uri=${MONGO_URL:mongodb+srv://dev_team:tsVmf6PBTZ7lok1o@cluster0.bxcwvsw.mongodb.net/flomadprod-db?retryWrites=true&w=majority&appName=Cluster0}
