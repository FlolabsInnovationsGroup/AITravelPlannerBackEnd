name: FloTravel - BackEnd CI/CD Latency Testing

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # =======================================
  # 1. End-to-End Testing
  # =======================================
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Start Spring Boot Server
        run: |
          nohup mvn spring-boot:run &
          sleep 20

      - name: Wait for Backend to Start
        run: |
          for i in {1..20}; do
            if curl -s https://www.flomadtravel.com/auth/signin | grep '"status":"UP"' ; then
               echo "Backend is up!"
               exit 0
            fi
            echo "Waiting for backend..."
            sleep 3
          done
          echo "Backend did not start"
          exit 1        

      - name: Run E2E Tests
        run: |
          curl -X POST https://www.flomadtravel.com/auth/signin -d '{"name":"Tim"}' -H "Content-Type: application/json"
          curl https://www.flomadtravel.com/auth/signin

      - name: Upload E2E Test Results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: target/surefire-reports
    
  # =====================================
  # 2. Linter Checks
  # =====================================
  build-test:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:dind

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven Repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build & Test with Maven
        run: |
          mvn install
          mvn checkstyle:check 

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/*.jar

  # ======================================
  # 3. LATENCY + LOAD TEST (k6)
  # ======================================
  latency-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Start Spring Boot Server
        run: |
          nohup mvn spring-boot:run &
          sleep 20

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg ca-certificates
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create k6 Latency Test Script
        run: |
          cat << 'EOF' > latency-test.js
          import http from 'k6/http';
          import { sleep } from 'k6';

          export const options = {
            vus: 20,            // 20 virtual users
            duration: '30s',    // run for 30 seconds
            thresholds: {
              http_req_duration: ['p(95)<500'],   // 95% of requests < 500ms
            },
          };

          export default function () {
            http.get('https://www.flomadtravel.com/auth/signin'); // CHANGE THIS TO YOUR ENDPOINT
            sleep(0.1);
          }
          EOF

      - name: Run k6 Latency Test
        run: |
          mkdir -p k6-results
          k6 run latency-test.js --out json=k6-results/latency.json | tee k6-results/summary.txt

      - name: Upload Latency Test Results
        uses: actions/upload-artifact@v4
        with:
          name: latency-test-results
          path: k6-results


  release:
    runs-on: ubuntu-latest
    needs: [ e2e-test, build-test, latency-test ]
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: built-jar
          path: ./release-output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: |
            release-output/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

