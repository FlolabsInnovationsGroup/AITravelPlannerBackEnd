spring.profiles.active=${SPRING_PROFILES_ACTIVE}

# General
spring.application.name=Flomad-AI-planner

# CORS Configuration (handled by WebMvcConfig)
application.cors.allowed.origins=http://localhost:3000,https://www.flomadtravel.com,https://flomadtravel.com,https://api.flomadtravel.com,http://api.flomadtravel.com,http://localhost:8080

# WebSocket Configuration (handled by WebSocketConfig)
# Path: /ws with SockJS support

#Guest
application.guest-message-limit=1000


# Google API
google.api.key=${GOOGLE_API_KEY}
google.api.baseurl=https://maps.googleapis.com/maps/api/place
google.places.fieldMask=name,formatted_address,geometry,place_id,rating,types,photos,opening_hours
google.textSearch.fieldMask=name,formatted_address,geometry,place_id,types,photos
google.places.max-results=20

# SpringAI
spring.main.allow-bean-definition-overriding=true

# OpenAI API
spring.ai.openai.audio.transcription.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-3.5-turbo
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.chat.options.max-tokens=2048
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.top-p=0.9
# Chat memory configuration
chat.memory.max-messages=2

# Vertex AI
spring.ai.vertex.ai.gemini.project-id=flomadaiplanner
spring.ai.vertex.ai.gemini.location=us-east1

# Viator API
viator.api.key=${VIATOR_API_KEY}
viator.api.partnerKey=${VIATOR_PARTNER_KEY}
viator.api.baseurl=https://api.viator.com/partner

# Amadeus API
amadeus.api.key=${AMADEUS_API_KEY}
amadeus.api.secret=${AMADEUS_API_SECRET}
amadeus.api.oauth2.url=https://test.api.amadeus.com/v1/security/oauth2/token
amadeus.api.baseurl=https://test.api.amadeus.com/

# FreeCurrencyAPI
free-currency.api.baseurl=https://api.freecurrencyapi.com/v1
free-currency.api.key=${FREECURRENCY_API_KEY}

# PositionStack API
position-stack.api.baseurl=https://api.positionstack.com/v1
position-stack.api.key=${POSITIONSTACK_API_KEY}

# Spring Security / JWT
application.email.confirmation.enabled=false
spring.mail.host=smtp.flomadtravel.com
spring.mail.port=587
spring.mail.username=noreply@flomadtravel.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
logging.level.org.springframework.mail=DEBUG
logging.level.javax.mail=DEBUG
logging.level.com.sun.mail=DEBUG
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# OAuth2

## Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=https://api.flomadtravel.com/login/oauth2/code/google

## Github
#spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
#spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

##LinkedIn
spring.security.oauth2.client.provider.linkedin.authorization-uri=https://www.linkedin.com/oauth/v2/authorization
spring.security.oauth2.client.provider.linkedin.token-uri=https://www.linkedin.com/oauth/v2/accessToken
spring.security.oauth2.client.provider.linkedin.user-info-uri=https://api.linkedin.com/v2/me
spring.security.oauth2.client.provider.linkedin.user-name-attribute=id
spring.security.oauth2.client.registration.linkedin.provider=linkedin
spring.security.oauth2.client.registration.linkedin.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.linkedin.client-id=${LINKEDIN_CLIENT_ID}
spring.security.oauth2.client.registration.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET}
spring.security.oauth2.client.registration.linkedin.scope=openid,profile,w_member_social,email
spring.security.oauth2.client.registration.linkedin.redirect-uri=https://api.flomadtravel.com/login/oauth2/code/linkedin


## Facebook
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.redirect-uri=https://api.flomadtravel.com/login/oauth2/code/facebook
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v12.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v12.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email

# Server
server.port=${SERVER_PORT}

# Elasticsearch configuration
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=your_password

# Logging configuration
logging.config=classpath:logging/logback-default.xml
logging.level.root=INFO
logging.level.com.example=INFO

# Mongock MongoDB Configuration
mongock.migration-scan-package=com.springboot.FlomadAIplanner.changelogs
mongock.enabled=true
mongock.transactional=false
mongock.transaction-strategy=change-unit
mongock.mongo-db.write-concern.w=majority
mongock.mongo-db.write-concern.wTimeoutMs=1000
mongock.mongo-db.write-concern.journal=true
mongock.mongo-db.read-concern=majority
mongock.mongo-db.read-preference=primary


# CORS Configuration
application.cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
application.cors.allowed.headers=Authorization,Content-Type
application.cors.allow.credentials=true
