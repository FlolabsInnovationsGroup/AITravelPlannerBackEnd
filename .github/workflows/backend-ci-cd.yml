name: FloTravel - CI/CD Latency Testing

on:
  push:
  pull_request:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout + Java Setup
      # ----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ----------------------------
      # Cache Maven Dependencies
      # ----------------------------
      - name: Cache Maven Repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      # ----------------------------
      # Package JAR
      # ----------------------------
      - name: Package App
        run: mvn clean package --no-transfer-progress -DskipTests 

      # ----------------------------
      # Start Backend as Background Process
      # ----------------------------
      - name: Start Backend Server
        run: |
          nohup java -jar target/*.jar --server.port=8080 > server.log 2>&1 &
          echo $! > server.pid

      # ----------------------------
      # Wait for Backend to Become Healthy
      # ----------------------------
      - name: Wait for Backend
        run: |
          echo "Waiting for server to start..."
          for i in {1..25}; do
            if curl -s http://localhost:8080/actuator/health | grep '"status"' > /dev/null; then
              echo "Server is UP!"
              exit 0
            fi
            sleep 3
          done
          echo "Server failed to start"
          cat server.log
          exit 1

      # ----------------------------
      # E2E API Tests (Curl-based)
      # ----------------------------
      - name: Run E2E Tests
        run: |
          mkdir -p e2e-results
          echo "Running E2E Tests..."
          curl -s -o e2e-results/users.json https://www.flomadtravel.com/auth/signin || true
          
          # POST example
          curl -X POST https://www.flomadtravel.com/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"name":"Tim"}' \
            -o e2e-results/create-user.json || true

          # GET again
          curl -s https://www.flomadtravel.com/auth/signin \
            -o e2e-results/users-after.json || true

      # ----------------------------
      # Latency Test (Apache Benchmark)
      # ----------------------------
      - name: Install Apache Benchmark
        run: sudo apt-get install -y apache2-utils

      - name: Run Latency Benchmark
        run: |
          mkdir -p latency-results
          echo "Running latency test..."
          ab -n 200 -c 20 https://www.flomadtravel.com/auth/signin > latency-results/ab-results.txt

      # ----------------------------
      # Upload Artifacts (Test XMLs, logs, latency, e2e results)
      # ----------------------------
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: Upload E2E Results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results/

      - name: Upload Latency Results
        uses: actions/upload-artifact@v4
        with:
          name: latency-results
          path: latency-results/

      - name: Upload Server Logs
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server.log

