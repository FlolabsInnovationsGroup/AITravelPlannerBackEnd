version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - springboot-mongo-network
    volumes:
      - mongo-data:/data/db

  springboot:
    build: .
    container_name: springboot
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/dbangular
    depends_on:
      - mongo
    networks:
      - springboot-mongo-network

networks:
  springboot-mongo-network:

volumes:
  mongo-data: