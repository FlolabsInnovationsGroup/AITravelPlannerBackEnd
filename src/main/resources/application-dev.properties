spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}
# Frontend URL
application.front-end.url=https://www.flomadtravel.com

# Force HTTPS in production
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for

# Logging
logging.config=classpath:logging/logback-default.xml
logging.level.root=INFO
logging.level.com.example=DEBUG

# MongoDB
spring.data.mongodb.uri=${MONGO_URL}
spring.data.mongodb.ssl.enabled=true
logging.level.org.mongodb.driver=WARN
# Development environment properties
application.backend.url=https://api.flomadtravel.com
application.cors.allowed.origins=https://www.flomadtravel.com,https://flomadtravel.com,https://ai-travel-planner-frontend-nextjs.vercel.app,https://api.flomadtravel.com,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000


# Elasticsearch configuration
spring.elasticsearch.uris=elasticsearch:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=your_password




