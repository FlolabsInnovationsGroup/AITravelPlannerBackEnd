name: Deploy to AWS EC2

on:
  push:
    branches:
      - master  # Make sure this matches your main branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress -DskipTests

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ec2-50-17-181-203.compute-1.amazonaws.com >> ~/.ssh/known_hosts

      - name: Create .env file
        run: |
          cat > .env << EOF
          SPRING_AI_OPENAI_API_KEY=${{ secrets.SPRING_AI_OPENAI_API_KEY }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          VIATOR_API_KEY=${{ secrets.VIATOR_API_KEY }}
          VIATOR_PARTNER_KEY=${{ secrets.VIATOR_PARTNER_KEY }}
          AMADEUS_API_KEY=${{ secrets.AMADEUS_API_KEY }}
          AMADEUS_API_SECRET=${{ secrets.AMADEUS_API_SECRET }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          MONGO_URL=${{ secrets.MONGO_URL }}
          WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
          POSITION_STACK_API_KEY=${{ secrets.POSITION_STACK_API_KEY }}
          SPRING_PROFILES_ACTIVE=prod
          EOF
          echo ".env file created successfully"

      - name: Verify JAR before copy
        run: |
          echo "=== JAR FILE ON GITHUB ACTIONS ==="
          ls -lh target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          echo ""
          echo "=== JAR CHECKSUM ==="
          sha256sum target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          echo ""
          echo "=== JAR STRUCTURE CHECK ==="
          unzip -l target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar | grep -E "BOOT-INF|springframework" | head -10
      
      - name: Copy files to EC2
        run: |
          scp -v -i ~/.ssh/id_rsa target/Flomad-AI-planner-0.0.1-SNAPSHOT.jar ubuntu@ec2-50-17-181-203.compute-1.amazonaws.com:/home/ubuntu/app/
          scp -v -i ~/.ssh/id_rsa .env ubuntu@ec2-50-17-181-203.compute-1.amazonaws.com:/home/ubuntu/app/

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@ec2-50-17-181-203.compute-1.amazonaws.com '
          sudo apt update
          sudo apt install -y openjdk-17-jdk unzip
          cd ~/app
          
          # Create logs directory
          mkdir -p logs
          
          # Stop service first
          sudo systemctl stop flomad || true
          
          echo "=== JAR FILES AFTER COPY ==="
          ls -lh *.jar 2>&1 || echo "No JAR files found!"
          
          echo ""
          echo "=== JAR CHECKSUM ON EC2 ==="
          sha256sum Flomad-AI-planner-0.0.1-SNAPSHOT.jar 2>&1 || echo "Cannot calculate checksum!"
          
          echo ""
          echo "=== JAR STRUCTURE ON EC2 ==="
          unzip -l Flomad-AI-planner-0.0.1-SNAPSHOT.jar | grep -E "BOOT-INF|springframework" | head -10
          
          echo "=== Stopping existing service ==="
          sudo systemctl stop flomad || echo "Service not running"
          
          echo ""
          echo "=== Waiting for service to fully stop ==="
          sleep 3
          
          echo ""
          echo "=== Removing old JAR files from target directory ==="
          # Only clean up old JARs in subdirectories, not the root level
          rm -rf target/ || echo "No target directory to clean"
          find . -name "*.jar.original" -delete || echo "No .original files to clean"
          
          echo ""
          echo "=== Verifying transferred JAR exists ==="
          ls -lh Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          sha256sum Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          
          echo ""
          echo "=== Testing JAR integrity ==="
          unzip -t Flomad-AI-planner-0.0.1-SNAPSHOT.jar | tail -1
          
          echo ""
          echo "=== Java Version Check ==="
          java -version
          which java
          
          # Secure the .env file
          chmod 600 .env
          
          # Reload systemd, enable and start service
          sudo systemctl daemon-reload
          sudo systemctl enable flomad
          sudo systemctl start flomad
          
          echo "=== Waiting for application startup (60 seconds) ==="
          sleep 60
          
          echo ""
          echo "=== SERVICE STATUS ==="
          sudo systemctl status flomad --no-pager || true
          
          echo ""
          echo "=== CHECKING PROCESS ==="
          ps aux | grep java | grep -v grep || echo "No Java process running"
          
          echo ""
          echo "=== PORT 8080 STATUS ==="
          sudo netstat -tlnp | grep 8080 || echo "Port 8080 not listening"
          
          echo ""
          echo "=== TESTING HEALTH ENDPOINT ==="
          for i in {1..5}; do
            echo "Attempt $i of 5..."
            if curl -f http://localhost:8080/actuator/health; then
              echo "✅ SUCCESS! Backend is healthy"
              exit 0
            fi
            echo "Health check failed, waiting 10 seconds..."
            sleep 10
          done
          
          echo ""
          echo "❌ FAILED! Backend not responding"
          echo ""
          echo "=== RECENT ERROR LOGS ==="
          tail -100 logs/error.log 2>/dev/null || echo "No error log available"
          
          echo ""
          echo "=== JOURNAL LOGS (Last 100 lines) ==="
          sudo journalctl -u flomad -n 100 --no-pager
          
          echo ""
          echo "=== FILE PERMISSIONS ==="
          ls -la Flomad-AI-planner-0.0.1-SNAPSHOT.jar
          
          exit 1
          '