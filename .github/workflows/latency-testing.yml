name: FloTravel - Latency Testing

on:
  push:
    branches: [ "master" ]

jobs:
  perf-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017  
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Start Spring Boot backend
        run: |
          nohup mvn spring-boot:run > server.log 2>&1 &
          sleep 12   # give time for boot

      - name: Wait for Spring Boot to Start
        run: |
          echo "Waiting for Spring Boot to start on Port 8080..."
          for i in {1..40}; do
            if nc -z localhost 8080; then
              echo "Spring Boot is up and running!"
              exit 0
            fi 
            echo "Waiting for Spring Boot..."
            sleep 2
          done  
          echo "ERROR: Spring Boot did not start in time" >&2
          echo "=== SERVER LOGS ==="
          cat server.log
          exit 1

      - name: Run latency benchmark (Apache Benchmark)
        run: |
          ab -n 200 -c 10 http://localhost:8080/actuator/health > ab-results.txt

      - name: Upload latency results
        uses: actions/upload-artifact@v4
        with:
          name: latency-metrics
          path: ab-results.txt
