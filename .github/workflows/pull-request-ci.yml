name: FloTravel - Pull Request Testing

on:
  pull_request:
    branches: [ "**" ]
    
jobs:
  build-test-lint:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -------------------------------
      # Automatic Performance Enhancer
      # -------------------------------
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      # ------------------------------
      # INSTALL MAVEN
      # ------------------------------
      - name: Maven Installation
        run: mvn clean install 
        
      # ------------------------------
      # LINTING
      # ------------------------------
      - name: Run Linting (Checkstyle)
        run: mvn checkstyle:check

      # ------------------------------
      # UNIT TESTS
      # ------------------------------
      - name: Run Tests with Reports
        run: mvn test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/pull_request_report.xml
            **/target/surefire-reports/pull_request_report.txt
            **/target/surefire-reports/pull_request_report.html

      # ------------------------------
      # BUILD VERIFICATION
      # ------------------------------
      - name: Build Application
        run: mvn package -DskipTests=false

      - name: Upload Build Artifact (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: built-jar
          path: |
            **/target/*.jar
